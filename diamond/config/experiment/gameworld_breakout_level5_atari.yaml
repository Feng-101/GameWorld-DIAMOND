# @package _global_

# Level 5 specialist control experiment. Apart from the browser-specific
# environment contract, these values reproduce DIAMOND's default Atari
# training configuration as closely as possible.

common:
  seed: 20260715

gameworld:
  imagination_horizon: 15

collection:
  train:
    num_steps_total: 100000
    first_epoch:
      min: 5000
      max: 10000
      threshold_rew: 10
    steps_per_epoch: 100
  test:
    num_episodes: 4
    num_final_episodes: 100

world_model_env:
  horizon: ${gameworld.imagination_horizon}

denoiser:
  training:
    steps_first_epoch: 10000
    steps_per_epoch: 400

rew_end_model:
  training:
    steps_first_epoch: 10000
    steps_per_epoch: 400

actor_critic:
  training:
    steps_first_epoch: 5000
    steps_per_epoch: 400
  actor_critic_loss:
    backup_every: ${gameworld.imagination_horizon}

training:
  num_final_epochs: 50
  # This is DIAMOND's Atari default and changes speed, not the algorithm.
  # Override training.compile_wm=false only if the server CUDA/Triton stack
  # cannot compile the world model.
  compile_wm: true

checkpointing:
  # At most four 100-epoch snapshots plus one non-aligned final snapshot.
  save_agent_every: 100
  num_to_keep: 4

evaluation:
  should: true
  every: 10
