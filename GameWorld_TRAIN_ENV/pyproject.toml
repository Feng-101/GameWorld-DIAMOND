[project]
name = "gameworld-train-env"
version = "0.1.0"
description = "Standalone GameWorld Breakout environment for DIAMOND training"
requires-python = ">=3.12"
dependencies = [
    "pillow==10.3.0",
    "playwright==1.45.0",
    "pyzmq==26.0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["env*", "tools*"]

